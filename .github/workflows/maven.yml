name: build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # platform must match the name of the Maven profile that the runner activates
        include:
          - { os: Linux,   arch: x86_64, platform: linux-x86_64,   runner: ubuntu-latest,    distribution: temurin }
          - { os: Linux,   arch: arm64,  platform: linux-arm64,    runner: ubuntu-24.04-arm, distribution: temurin }
          - { os: macOS,   arch: x86_64, platform: macos-x86_64,   runner: macos-26-intel,   distribution: temurin }
          - { os: macOS,   arch: arm64,  platform: macos-arm64,    runner: macos-latest,     distribution: temurin }
          - { os: Windows, arch: x86_64, platform: windows-x86_64, runner: windows-latest,   distribution: temurin }
          # Temurin has no JDK 25 build for Windows arm64
          - { os: Windows, arch: arm64,  platform: windows-arm64,  runner: windows-11-arm,   distribution: zulu }
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: ${{ matrix.distribution }}
          cache: maven
      - name: Build with Maven
        run: mvn -B verify --file pom.xml
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ronja-${{ matrix.platform }}
          path: target/ronja-*-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: archives
          pattern: ronja-*
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" archives/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --generate-notes
          --title "${GITHUB_REF_NAME#v}"
